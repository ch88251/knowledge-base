services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      KB_ELASTICSEARCH_URL: http://elasticsearch:9200
      KB_GOOGLE_CREDENTIALS_FILE: /secrets/credentials.json
      KB_GOOGLE_TOKEN_FILE: /secrets/token.json
      KB_DRIVE_FOLDER_ID: ${KB_DRIVE_FOLDER_ID:-}
    volumes:
      # Holds credentials.json (you provide) and token.json (written by `auth`).
      - ./secrets:/secrets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  esdata:
